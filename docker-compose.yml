services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: symfony_php
        user: "1000:1000"
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        env_file:
            - .env
        depends_on:
            - postgres
            - redis
            - rabbitmq
            - mailhog
        networks:
            - app

    nginx:
        image: nginx:1.27-alpine
        container_name: symfony_nginx
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php
        networks:
            - app

    postgres:
        image: postgres:18-alpine
        container_name: symfony_postgres
        environment:
            POSTGRES_DB: app
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app_password
            PGDATA: /var/lib/postgresql/18/docker
        ports:
            - "54320:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
        networks:
            - app

    redis:
        image: redis:7.4-alpine
        container_name: symfony_redis
        ports:
            - "63790:6379"
        volumes:
            - redis_data:/data
        command: redis-server --appendonly yes
        networks:
            - app

    rabbitmq:
        image: rabbitmq:3.13-management-alpine
        container_name: symfony_rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - app

    mailhog:
        image: mailhog/mailhog:v1.0.1
        container_name: symfony_mailhog
        ports:
            - "1025:1025"
            - "8025:8025"
        networks:
            - app

    worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: symfony_worker
        user: "1000:1000"
        working_dir: /var/www/html
        command: sh -lc "php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -vv"
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
        env_file:
            - .env
        depends_on:
            - php
            - rabbitmq
            - mailhog
            - postgres
        networks:
            - app

    outbox-relay:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        container_name: symfony_outbox_relay
        user: "1000:1000"
        working_dir: /var/www/html
        command: sh -lc "php bin/console app:outbox:relay --batch-size=100 --sleep=1 --time-limit=3600 --lock-timeout=60"
        restart: unless-stopped
        volumes:
            - ./:/var/www/html
        env_file:
            - .env
        depends_on:
            - php
            - rabbitmq
            - postgres
        networks:
            - app

volumes:
    postgres_data:
    redis_data:
    rabbitmq_data:

networks:
    app:
        driver: bridge
