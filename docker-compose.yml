services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: symfony_php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - mailhog
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    container_name: symfony_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - app

  mysql:
    image: mysql:8.4
    container_name: symfony_mysql
    command: --sql_mode="STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app

  redis:
    image: redis:7.4-alpine
    container_name: symfony_redis
    ports:
      - "63790:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - app

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: symfony_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: symfony_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: symfony_worker
    working_dir: /var/www/html
    command: sh -lc "php bin/console messenger:consume async --time-limit=3600 --memory-limit=256M -vv"
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - php
      - rabbitmq
      - mailhog
      - mysql
    networks:
      - app

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  app:
    driver: bridge
