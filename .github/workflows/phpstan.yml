name: PHPStan

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  phpstan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Prepare env
        run: cp .env.example .env

      - name: Build PHP image
        run: >
          UID=$(id -u) GID=$(id -g)
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build php

      - name: Install deps, warmup cache and run PHPStan
        run: >
          UID=$(id -u) GID=$(id -g)
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm php sh -lc
          "git config --global --add safe.directory /var/www/html &&
          composer install --no-interaction --prefer-dist &&
          php bin/console cache:warmup &&
          php -d memory_limit=1G vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress"
