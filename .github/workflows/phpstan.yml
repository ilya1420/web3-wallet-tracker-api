name: PHPStan

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  phpstan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: cp .env.example .env

      - name: Build PHP image
        run: docker compose build php

      - name: Install dependencies
        run: docker compose run --rm php composer install --no-interaction --prefer-dist

      - name: Warm up Symfony cache
        run: docker compose run --rm php php bin/console cache:warmup

      - name: Run PHPStan
        run: docker compose run --rm php php -d memory_limit=1G vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress
