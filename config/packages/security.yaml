security:
  password_hashers:
    App\Domain\Entity\User:
      algorithm: argon2id

  providers:
    app_user_provider:
      entity:
        class: App\Domain\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    web:
      pattern: ^/(app|$)
      lazy: true
      provider: app_user_provider
      custom_authenticators:
        - App\Infrastructure\Security\WebSessionAccessTokenAuthenticator
      logout:
        path: app_web_logout
        target: app_web_login
        invalidate_session: true
        enable_csrf: true
        csrf_parameter: _token
        csrf_token_id: web_logout

    api:
      pattern: ^/api
      stateless: true
      provider: app_user_provider
      custom_authenticators:
        - App\Infrastructure\Security\BearerTokenAuthenticator

  access_control:
    - { path: ^/$, roles: PUBLIC_ACCESS }
    - { path: ^/app/auth, roles: PUBLIC_ACCESS }
    - { path: ^/app, roles: ROLE_USER }
    - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/login-links, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/request-login-link, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/confirm-token, roles: PUBLIC_ACCESS }
    - { path: ^/api/web3, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/admin/users, roles: ROLE_ADMIN }
