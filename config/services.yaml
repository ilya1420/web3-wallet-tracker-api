parameters:
  app.url: '%env(APP_URL)%'
  app.mail_from: '%env(MAILER_FROM)%'
  app.login_token_ttl: '%env(LOGIN_TOKEN_TTL)%'
  app.access_token_ttl: '%env(ACCESS_TOKEN_TTL)%'
  app.registration_max_per_ip_day: '%env(int:REGISTRATION_MAX_PER_IP_DAY)%'
  app.web3.default_rpc_endpoint: '%env(WEB3_DEFAULT_RPC_URL)%'
  app.web3.request_timeout: '%env(float:WEB3_REQUEST_TIMEOUT)%'
  app.google.client_id: '%env(GOOGLE_CLIENT_ID)%'
  app.google.client_secret: '%env(GOOGLE_CLIENT_SECRET)%'
  app.google.redirect_uri: '%env(GOOGLE_REDIRECT_URI)%'
  app.telegram.bot_token: '%env(TELEGRAM_BOT_TOKEN)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Kernel.php'

  App\Domain\Repository\UserRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\UserRepository'
  App\Domain\Repository\LoginTokenRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\LoginTokenRepository'
  App\Domain\Repository\AccessTokenRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\AccessTokenRepository'
  App\Domain\Repository\Web3WalletRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\Web3WalletRepository'
  App\Domain\Repository\SocialAccountRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\SocialAccountRepository'
  App\Domain\Repository\NotificationChannelRepositoryInterface: '@App\Infrastructure\Persistence\Doctrine\Repository\NotificationChannelRepository'

  App\Application\Service\Web3ProviderGatewayInterface: '@App\Infrastructure\Web3\Web3ProviderGateway'
  App\Infrastructure\SocialAuth\SocialHttpClientInterface: '@App\Infrastructure\SocialAuth\NativeSocialHttpClient'

  _instanceof:
    App\Application\Service\SocialAuthProvider:
      tags: ['app.social_auth_provider']

  App\Application\Service\SocialAuthService:
    arguments:
      $providers: !tagged_iterator app.social_auth_provider

  App\Application\Service\LoginRateLimiterService:
    arguments:
      $loginRequestLimiter: '@limiter.login_request'

  App\Application\Service\MultiAccountGuardService:
    arguments:
      $registrationContextRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\UserRegistrationContextRepository'
      $registrationIpCounterRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\RegistrationIpCounterRepository'
      $maxRegistrationsPerIpPerDay: '%app.registration_max_per_ip_day%'

  App\Application\UseCase\RequestLoginLinkUseCase:
    arguments:
      $loginTokenTtl: '%app.login_token_ttl%'

  App\Application\UseCase\RegisterUserUseCase:
    arguments:
      $loginTokenTtl: '%app.login_token_ttl%'

  App\Application\UseCase\ConfirmLoginTokenUseCase:
    arguments:
      $accessTokenTtl: '%app.access_token_ttl%'

  App\Application\UseCase\SignInWithPasswordUseCase:
    arguments:
      $accessTokenTtl: '%app.access_token_ttl%'

  App\Application\UseCase\SignInWithSocialProfileUseCase:
    arguments:
      $accessTokenTtl: '%app.access_token_ttl%'

  App\Application\UseCase\CreateWeb3WalletUseCase:
    arguments:
      $defaultRpcEndpoint: '%app.web3.default_rpc_endpoint%'

  App\Infrastructure\Web3\Web3ProviderGateway:
    arguments:
      $requestTimeout: '%app.web3.request_timeout%'

  App\Infrastructure\SocialAuth\GoogleIdTokenVerifier:
    arguments:
      $clientId: '%app.google.client_id%'

  App\Infrastructure\SocialAuth\GoogleOAuth2Provider:
    arguments:
      $clientId: '%app.google.client_id%'
      $clientSecret: '%app.google.client_secret%'
      $redirectUri: '%app.google.redirect_uri%'

  App\Infrastructure\SocialAuth\TelegramWidgetProvider:
    arguments:
      $botToken: '%app.telegram.bot_token%'

  App\Infrastructure\Mail\LoginLinkMailer:
    arguments:
      $appUrl: '%app.url%'
      $mailFrom: '%app.mail_from%'
